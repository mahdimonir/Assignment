openapi: 3.0.3
info:
  title: Vehicle Rental System API
  description: Complete backend API for vehicle rental management with role-based authentication
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/v1
    description: Local Development
  - url: https://your-app.vercel.app/api/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: "Unauthorized" }

    Forbidden:
      description: Access denied (insufficient permissions)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: "Forbidden" }

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: "Route not found" }

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role: { type: string, enum: [admin, customer] }

    Vehicle:
      type: object
      properties:
        id: { type: integer }
        vehicle_name: { type: string }
        type: { type: string }
        registration_number: { type: string }
        daily_rent_price: { type: number }
        availability_status: { type: string, enum: [available, booked] }

    BookingAdmin:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        vehicle_id: { type: integer }
        rent_start_date: { type: string, format: date }
        rent_end_date: { type: string, format: date }
        total_price: { type: number }
        status: { type: string, enum: [active, cancelled, returned] }
        customer:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
        vehicle:
          type: object
          properties:
            vehicle_name: { type: string }
            registration_number: { type: string }

    BookingCustomer:
      type: object
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        rent_start_date: { type: string, format: date }
        rent_end_date: { type: string, format: date }
        total_price: { type: number }
        status: { type: string, enum: [active, cancelled, returned] }
        vehicle:
          type: object
          properties:
            vehicle_name: { type: string }
            registration_number: { type: string }
            type: { type: string }

security:
  - bearerAuth: []

paths:
  /auth/signup:
    post:
      summary: Register New User
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, phone]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                phone: { type: string }
                role:
                  { type: string, enum: [customer, admin], default: customer }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }

  /auth/signin:
    post:
      summary: Login User
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: "#/components/schemas/User" }

  /vehicles:
    post:
      summary: Create Vehicle (Admin only)
      tags: [Vehicles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_name, registration_number, daily_rent_price]
              properties:
                vehicle_name: { type: string }
                type: { type: string }
                registration_number: { type: string }
                daily_rent_price: { type: number }
                availability_status: { type: string, enum: [available, booked] }
      responses:
        "201": { description: Vehicle created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    get:
      summary: Get All Vehicles (Public)
      tags: [Vehicles]
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vehicle" }

  /vehicles/{vehicleId}:
    get:
      summary: Get Vehicle by ID
      tags: [Vehicles]
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Vehicle details }

    put:
      summary: Update Vehicle (Admin only)
      tags: [Vehicles]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_name: { type: string }
                type: { type: string }
                registration_number: { type: string }
                daily_rent_price: { type: number }
                availability_status: { type: string }
      responses:
        "200": { description: Vehicle updated }

    delete:
      summary: Delete Vehicle (Admin only)
      tags: [Vehicles]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Vehicle deleted }

  /users:
    get:
      summary: Get All Users (Admin only)
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of users }

  /users/{userId}:
    put:
      summary: Update User (Admin or Own)
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                role: { type: string, enum: [admin, customer] }
      responses:
        "200": { description: User updated }

    delete:
      summary: Delete User (Admin only)
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: User deleted }

  /bookings:
    post:
      summary: Create Booking
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, rent_start_date, rent_end_date]
              properties:
                customer_id: { type: integer }
                vehicle_id: { type: integer }
                rent_start_date: { type: string, format: date }
                rent_end_date: { type: string, format: date }
      responses:
        "201": { description: Booking created }

    get:
      summary: Get Bookings (Admin → All, Customer → Own)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/BookingAdmin"
                        - $ref: "#/components/schemas/BookingCustomer"

  /bookings/{bookingId}:
    put:
      summary: Update Booking Status (cancelled / returned)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [cancelled, returned]
      responses:
        "200": { description: Booking status updated }
